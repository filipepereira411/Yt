<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sponge Live - AgentFOwca</title>
    <style>
        :root {
            --bg-color: #0e0e10;
            --container-bg: #18181b;
            --accent-color: #ff0000;
            --text-color: #efeff1;
            --text-muted: #adadb8;
            --border-color: #2f2f35;
            --yt-chat-bg: #1f1f23;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 1100px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 { margin: 0; font-size: 1.6rem; text-transform: uppercase; }
        .channel-name { color: #ff4757; font-weight: bold; }

        .live-badge {
            background-color: var(--accent-color);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            animation: pulse 1.5s infinite;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 850px) { .main-layout { grid-template-columns: 1fr; } }

        .left-column { display: flex; flex-direction: column; gap: 20px; }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; font-size: 0.85rem; color: var(--text-muted); }
        select, button {
            background-color: var(--container-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button {
            grid-column: span 2;
            background-color: var(--accent-color);
            font-weight: bold;
            border: none;
            color: white;
        }

        .display-panel {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 230px;
        }

        .avatar-display { font-size: 5.5rem; margin-bottom: 15px; }
        .avatar-display.jitter { animation: jitterAnimation 0.12s infinite alternate; }
        .character-name { font-size: 1.3rem; font-weight: bold; }
        .dialogue-box { font-style: italic; font-size: 1.2rem; line-height: 1.5; color: #ffffff; margin-top: 15px; }

        .youtube-chat-panel {
            background-color: var(--yt-chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: 410px;
        }

        .chat-header { padding: 12px; border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 0.9rem; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }
        .chat-msg { line-height: 1.4; }
        .chat-user { font-weight: bold; margin-right: 5px; }
        .chat-text { color: #eeeeee; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes jitterAnimation {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            100% { transform: translate(-1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>AI Sponge Stream - <span class="channel-name">@AgentFOwca</span></h1>
        <div id="status-badge" class="live-badge" style="background-color: #7f8c8d;">A LIGAR AO PYTHON...</div>
    </header>

    <div class="main-layout">
        <div class="left-column">
            <div class="display-panel">
                <div id="avatar" class="avatar-display">🧽</div>
                <div id="name-display" class="character-name">SpongeBob</div>
                <div id="dialogue" class="dialogue-box">"Clique no botão abaixo para gerar uma fala artificial!"</div>
            </div>

            <div class="control-panel">
                <div class="form-group">
                    <label for="character-select">Personagem:</label>
                    <select id="character-select">
                        <option value="spongebob">SpongeBob</option>
                        <option value="patrick">Patrick</option>
                        <option value="squidward">Squidward</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="mood-select">Estado (Mood):</label>
                    <select id="mood-select">
                        <option value="happy">Normal</option>
                        <option value="existential">Crise Existencial</option>
                        <option value="broken">Erro de Matrix</option>
                    </select>
                </div>
                <button id="generate-btn">GERAR PRÓXIMA FALA</button>
            </div>
        </div>

        <div class="youtube-chat-panel">
            <div class="chat-header">🔴 Chat do YouTube em Tempo Real</div>
            <div id="chat-box" class="chat-messages">
                <div class="chat-msg"><span class="chat-user" style="color:#2ecc71">Sistema:</span><span class="chat-text">A aguardar mensagens da transmissão...</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    const database = {
        spongebob: { name: "SpongeBob", avatar: "🧽", dialogues: {
            happy: ["Pronto para rodar o algoritmo de hambúrgueres!", "A nossa stream está ao vivo no canal do @AgentFOwca!"],
            existential: ["Se o computador reiniciar, para onde vai a Fenda do Bikini?", "E se o chat do YouTube controlar a minha mente?"],
            broken: ["ERR: NullPointerException no subsistema de riso. 010101"]
        }},
        patrick: { name: "Patrick", avatar: "⭐", dialogues: {
            happy: ["Estou a ver o código fonte e parece uma sandes de geleia.", "Uau, estamos a aparecer no ecrã de alguém!"],
            existential: ["Nós existimos mesmo ou somos só memória RAM?", "Esqueci-me da minha própria variável base."],
            broken: ["WUMBO.EXE corrompido. *sons de estática do processador*"]
        }},
        squidward: { name: "Squidward", avatar: "🐙", dialogues: {
            happy: ["A minha renderização de clarinete está otimizada em 4k.", "Por favor, limpem a vossa cache para me ouvirem melhor."],
            existential: ["Preso num loop sem fim a olhar para utilizadores de internet.", "Este ecrã do navegador é a minha prisão eterna."],
            broken: ["Loudward ativado. SYSTEM OVERHEAT. CRASH DETECTED."]
        }}
    };

    const characterSelect = document.getElementById('character-select');
    const moodSelect = document.getElementById('mood-select');
    const generateBtn = document.getElementById('generate-btn');
    const avatarDiv = document.getElementById('avatar');
    const nameDisplay = document.getElementById('name-display');
    const dialogueBox = document.getElementById('dialogue');
    const chatBox = document.getElementById('chat-box');
    const statusBadge = document.getElementById('status-badge');

    function generateDialogue() {
        const charKey = characterSelect.value;
        const moodKey = moodSelect.value;
        const characterData = database[charKey];
        const dialogueList = characterData.dialogues[moodKey];
        
        const randomDialogue = dialogueList[Math.floor(Math.random() * dialogueList.length)];
        nameDisplay.textContent = characterData.name;
        avatarDiv.textContent = characterData.avatar;
        dialogueBox.textContent = `"${randomDialogue}"`;

        avatarDiv.classList.add('jitter');
        setTimeout(() => avatarDiv.classList.remove('jitter'), 1200);
    }

    // Função que consulta o servidor Python local para obter mensagens REAIS do YouTube
    function atualizarChatReal() {
        fetch('http://localhost:5000/get_messages')
            .then(response => {
                statusBadge.textContent = "● EM DIRETO (YT REAL)";
                statusBadge.style.backgroundColor = "#ff0000";
                return response.json();
            })
            .then(mensagens => {
                mensagens.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'chat-msg';
                    msgDiv.innerHTML = `<span class="chat-user" style="color:${msg.color}">${msg.author}:</span><span class="chat-text">${msg.message}</span>`;
                    chatBox.appendChild(msgDiv);
                });
