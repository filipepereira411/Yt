<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sponge Simulator - Live Feed</title>
    <style>
        :root {
            --bg-color: #0e0e10;
            --container-bg: #18181b;
            --accent-color: #ff0000; /* Vermelho estilo YouTube Live */
            --text-color: #efeff1;
            --text-muted: #adadb8;
            --border-color: #2f2f35;
            --yt-chat-bg: #1f1f23;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 1100px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            margin: 0;
            color: var(--text-color);
            font-size: 1.8rem;
            text-transform: uppercase;
        }

        .live-badge {
            background-color: var(--accent-color);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            animation: pulse 1.5s infinite;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        select, button {
            background-color: var(--container-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button {
            grid-column: span 2;
            background-color: var(--accent-color);
            font-weight: bold;
            border: none;
            color: white;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #cc0000;
        }

        .display-panel {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 250px;
        }

        .avatar-display {
            font-size: 5.5rem;
            margin-bottom: 15px;
        }

        .avatar-display.jitter {
            animation: jitterAnimation 0.12s infinite alternate;
        }

        .character-name {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .dialogue-box {
            font-style: italic;
            font-size: 1.2rem;
            line-height: 1.5;
            color: #ffffff;
            margin-top: 15px;
            max-width: 85%;
        }

        /* Coluna do Chat do YouTube */
        .youtube-chat-panel {
            background-color: var(--yt-chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: 430px;
        }

        .chat-header {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
        }

        .chat-msg {
            line-height: 1.4;
        }

        .chat-user {
            font-weight: bold;
            color: #aaaaaa;
            margin-right: 5px;
        }

        .chat-text {
            color: #eeeeee;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes jitterAnimation {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            100% { transform: translate(-1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

                </div>
                <button id="generate-btn">GERAR PRÓXIMA FALA</button>
            </div>
        </div>

        <!-- Coluna da Direita: Chat Simulado do YouTube -->
        <div class="youtube-chat-panel">

            <div id="chat-box" class="chat-messages">

        </div>
    </div>
</div>
